# Runs on every pull request, so nothing reaches main without the same gate as the deploy:
# `npm run check` (type-checks, the page's rules, the translation parity, the build), plus a dependency audit.
# Make the "Check" job a required status check in Settings › Branches (or a ruleset) for main.

name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to the same pull request cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The build must be reproducible: a committed file that the build rewrites is a mistake.
      - name: Nothing generated is left uncommitted
        run: git diff --exit-code

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Fails on a known high-severity vulnerability in the (dev) dependencies.
      - run: npm audit --audit-level=high
